# Release skeleton. Manual trigger only; nothing here runs on push.
# Required repository secrets are listed in docs/RELEASE.md. iOS signing in CI also needs the
# distribution certificate + provisioning profile imported on the runner, which is NOT set up
# yet, so the iOS job is a TODO stub; the Android job is complete once secrets exist.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [build, patch, minor, major]
        default: build
      shipped_build:
        description: Highest build number already on ASC / Play
        required: true

permissions:
  contents: read

jobs:
  android-internal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: 3.38.7, channel: stable, cache: true }
      - run: scripts/bump_version.sh "$BUMP" --shipped "$SHIPPED_BUILD"
        env:
          BUMP: ${{ inputs.bump }}
          SHIPPED_BUILD: ${{ inputs.shipped_build }}
      - name: Restore signing material and config
        run: |
          mkdir -p "$RUNNER_TEMP/ks" env
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/ks/upload.jks"
          cat > android/key.properties <<PROPS
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=$RUNNER_TEMP/ks/upload.jks
          PROPS
          echo '${{ secrets.ENV_LOCAL_JSON }}' > env/local.json
          echo '${{ secrets.PLAY_JSON }}' > "$RUNNER_TEMP/play.json"
      - run: flutter pub get
      - run: dart run build_runner build
      - run: scripts/release_android_internal.sh --upload
        env:
          PLAY_JSON_KEY: ${{ runner.temp }}/play.json
      - uses: actions/upload-artifact@v4
        with: { name: app-release.aab, path: build/app/outputs/bundle/release/app-release.aab }

  ios-testflight:
    if: false  # TODO: enable after certificate/profile import is added (macos-latest + ASC key secrets).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "See docs/RELEASE.md, iOS in CI"
